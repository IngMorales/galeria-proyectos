<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Interactiva de Proyectos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Galería Interactiva de Proyectos</h1>
        <div class="controls">
            <button id="add-project-btn" class="btn"><i class="fas fa-plus"></i> Agregar Proyecto</button>
            <button id="clear-all-btn" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Limpiar Todo</button>
            <button id="theme-toggle-btn" class="btn btn-secondary" title="Cambiar Tema">
                <i class="fas fa-moon"></i> <span class="theme-text">Oscuro</span>
            </button>
        </div>
    </header>

    <main>
        <div id="project-form-container" class="form-container hidden">
            <form id="project-form" enctype="multipart/form-data">
                <h2 id="form-title">Agregar Nuevo Proyecto</h2>
                <input type="hidden" id="project-id"> <div class="form-group">
                    <label for="project-title">Título:</label>
                    <input type="text" id="project-title" required>
                    <span class="error-message" id="title-error"></span>
                </div>

                <div class="form-group">
                    <label for="project-description">Descripción:</label>
                    <textarea id="project-description" rows="4" required></textarea>
                     <span class="error-message" id="desc-error"></span>
                </div>

                <div class="form-group">
                    <label for="project-image">Imagen (Opcional):</label>
                    <input type="file" id="project-image" accept="image/png, image/jpeg, image/gif">
                    <span class="error-message" id="image-error"></span>
                    <img id="image-preview" src="#" alt="Vista previa de imagen" style="display: none; max-width: 100px; margin-top: 10px;"/>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn">Guardar Proyecto</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Cancelar</button>
                </div>
                 <div id="loading-indicator" class="loading hidden">
                    <i class="fas fa-spinner fa-spin"></i> Procesando...
                </div>
            </form>
        </div>

        <section id="project-gallery" class="gallery"></section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
