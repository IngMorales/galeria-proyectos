<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería de Proyectos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Galería Interactiva de Proyectos</h1>
        <button id="toggle-theme">🌙/☀️</button>
    </header>

    <main>
        <section id="form-section">
            <form id="project-form" enctype="multipart/form-data">
                <input type="text" id="title" placeholder="Título del Proyecto" required>
                <textarea id="description" placeholder="Descripción" required></textarea>
                <input type="file" id="image">
                <button type="submit">Agregar Proyecto</button>
            </form>
        </section>

        <section id="gallery" class="grid"></section>

        <button id="clear-all">🗑 Limpiar Todo</button>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
