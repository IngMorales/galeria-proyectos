<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Proyectos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-mode">
    <header>
        <h1>Galería de Proyectos</h1>
        <button id="toggle-theme" title="Cambiar tema">🌙</button>
    </header>
    <main>
        <section class="form-container">
            <form id="project-form" enctype="multipart/form-data">
                <h2 id="form-title">Agregar Proyecto</h2>
                <input type="hidden" id="project-id">
                <div class="form-group">
                    <label for="title">Título:</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Descripción:</label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Imagen (opcional):</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <button type="submit">Guardar</button>
                <button type="button" id="cancel-edit" style="display: none;">Cancelar</button>
            </form>
            <div id="loading" class="loading hidden">Cargando...</div>
        </section>
        <section class="controls">
            <button id="clear-all">Limpiar Todo</button>
        </section>
        <section id="gallery" class="gallery"></section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
