<!-- index.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Proyectos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Galería Interactiva</h1>
        <div class="controls">
            <button id="toggleTheme">🌓</button>
            <button id="clearAll">🗑️ Limpiar Todo</button>
        </div>
    </header>

    <main>
        <section class="project-form">
            <h2>🛠️ Nuevo Proyecto</h2>
            <form id="projectForm" enctype="multipart/form-data">
                <div class="form-group">
                    <input type="text" id="title" placeholder="Título del proyecto" required>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <textarea id="description" placeholder="Descripción del proyecto" required></textarea>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <input type="file" id="image" accept="image/*">
                    <label for="image" class="file-label">📸 Subir imagen (opcional)</label>
                </div>
                <input type="hidden" id="projectId">
                <button type="submit" id="submitBtn">💾 Guardar Proyecto</button>
            </form>
        </section>

        <section class="project-grid" id="projectGrid"></section>
    </main>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
